name: Unified Deploy

on:
  push:
    branches: [ all ]
    paths: 
      - 'seurasaeng_fe/**'
      - 'seurasaeng_be/**'
      - 'docker-compose.yml'
      - 'nginx.conf'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # Backend 빌드
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build Backend with Maven
      run: |
        cd seurasaeng_be
        mvn clean package -DskipTests
    
    # Frontend 빌드
    - name: Create Frontend .env file
      run: |
        cd seurasaeng_fe
        cat > .env << EOF
        VITE_SOCKET_URL=wss://shuttle.cengroup.co.kr/ws
        VITE_API_BASE_URL=https://shuttle.cengroup.co.kr/api
        VITE_MOBILITY_API_KEY=b058afe703170142bbc3095397401d17
        VITE_KAKAOMAP_API_KEY=73164f05aee7b0290c9b5b402b27c28a
        VITE_MOBILITY_API_BASE_URL=https://apis-navi.kakaomobility.com/v1/directions
        VITE_KAKAOMAP_API_BASE_URL=//dapi.kakao.com/v2/maps/sdk.js
        VITE_PERPLEXITY_API_KEY=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
        EOF
        echo "✅ Frontend .env file created"
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: seurasaeng_fe/package-lock.json
    
    - name: Install Frontend dependencies and build
      run: |
        cd seurasaeng_fe
        npm ci
        npm run build
    
    # Docker 빌드
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Backend Docker image
      run: |
        cd seurasaeng_be
        docker buildx build --platform linux/amd64 -t seuraseung-backend:latest . --load
    
    - name: Build Frontend Docker image
      run: |
        cd seurasaeng_fe
        docker buildx build --platform linux/amd64 -t seuraseung-frontend:latest . --load
    
    - name: Save Docker images
      run: |
        docker save seuraseung-backend:latest seuraseung-frontend:latest | gzip > unified-images.tar.gz
    
    # 서버로 파일 복사
    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}  # 3.37.254.139
        username: appsvc01
        key: ${{ secrets.SSH_PRIVATE_KEY }}  # .pem 파일 내용
        source: "unified-images.tar.gz,docker-compose.yml,nginx.conf"
        target: "/home/appsvc01/"
    
    # 배포 실행
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: appsvc01
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Docker 이미지 로드
          cd /home/appsvc01
          gunzip -c unified-images.tar.gz | docker load
          
          # 환경변수 파일 생성
          cat > .env << EOF
          DB_URL=jdbc:postgresql://bus-app-postgresql.cisryp9h2evy.ap-northeast-2.rds.amazonaws.com:5432/postgres
          DB_USERNAME=itcadm01
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SCHEMA=seurasaeng_prod
          AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION=ap-northeast-2
          AWS_BUCKET=profile-qrcode
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          CORS_ALLOWED_ORIGINS=https://shuttle.cengroup.co.kr
          spring.cloud.aws.credentials.access-key=${{ secrets.AWS_ACCESS_KEY }}
          spring.cloud.aws.credentials.secret-key=${{ secrets.AWS_SECRET_KEY }}
          spring.cloud.aws.region.static=ap-northeast-2
          spring.cloud.aws.s3.bucket=profile-qrcode
          EOF
          
          # 기존 컨테이너 정지 및 새로 시작
          docker-compose down
          docker-compose up -d
          
          # 정리
          docker system prune -f
          rm -f unified-images.tar.gz